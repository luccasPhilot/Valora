# Servidor do front (imagem nginx-unprivileged: roda sem root e escuta na 8080).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O Docker resolve o nome "backend" pelo DNS interno (127.0.0.11). Com o nome numa
  # variável, o nginx consulta de novo em vez de guardar o IP da hora em que subiu,
  # então recriar o backend numa atualização não deixa o front apontando para o vazio.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_url http://backend:3000;
    proxy_pass $backend_url$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Arquivos gerados pelo Vite têm hash no nome: nunca mudam, cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # O index.html nunca vai para o cache: é ele que aponta para os arquivos com hash.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # O service worker e o manifesto não têm hash no nome e nunca podem ficar presos em cache:
  # é por eles que o aparelho descobre que existe uma versão nova do app.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Rotas do app (/transactions, /budgets...) devolvem o index.html.
  location / {
    try_files $uri /index.html;
  }
}
