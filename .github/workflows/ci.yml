name: CI

# Roda em runner da GitHub (nunca no servidor de casa): os testes de integração
# usam Testcontainers e o build do front é pesado para um i5 com 8 GB.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Inclui os testes de integração (Testcontainers sobe o PostgreSQL no Docker do runner).
      - run: npm test
      - run: npm run build

  infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Testes dos scripts do servidor (backup, retenção, restore-check, avisos), em bash puro.
      - run: bash infra/scripts/tests/run-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker-boot:
    name: Docker boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sobe o Compose de producao de verdade (banco, backend e frontend) com valores falsos: sem
      # segredo do repositorio, sem push de imagem, sem deploy. O SYNC_CRON de 30 de fevereiro nunca
      # cai em dia nenhum, entao nenhuma sincronizacao dispara e o Pluggy nao e chamado.
      - name: Criar infra/.env de mentira
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "PLUGGY_CLIENT_ID=ci"
            echo "PLUGGY_CLIENT_SECRET=ci"
            echo "PLUGGY_ITEM_IDS=ci-item"
            echo "SYNC_CRON=0 0 30 2 *"
          } > infra/.env

      - name: Subir a stack e esperar os healthchecks
        run: docker compose -f infra/compose.yml up -d --build --wait --wait-timeout 180

      - name: Conferir o healthcheck pelo frontend
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"database":"ok"'

      - name: Mostrar os logs
        if: failure()
        run: docker compose -f infra/compose.yml logs --no-color --tail 100

      - name: Derrubar a stack
        if: always()
        run: docker compose -f infra/compose.yml down -v
